services:
  bot:
    build: .
    container_name: predloshka-bot
    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

    volumes:
      - ./data:/data

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"